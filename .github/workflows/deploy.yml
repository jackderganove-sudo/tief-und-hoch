name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Deployments gleichzeitig; ein laufendes wird zu Ende gebracht.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Schlagen Tests oder Fragen-Validierung fehl, bricht der Job hier ab – kein Deploy.
      - name: Tests
        run: npm test
      - name: Fragen validieren
        run: npm run validate-questions
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Test-Version: Debug-Panel über ?debug=1 erreichbar. Zum Abschalten diese Zeile entfernen.
          VITE_ENABLE_DEBUG: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
