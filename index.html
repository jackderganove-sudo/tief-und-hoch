<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: Inhalt bis unter Notch/Gestenleiste, Abstände per env(safe-area-inset-*).
         interactive-widget: Android verkleinert das Layout bei offener Tastatur (Eingabefeld bleibt sichtbar). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Jeden Tag 7 Fragen: Je seltener deine Antwort, desto tiefer – je häufiger, desto höher. Ein Pixel-Trivia-Spiel." />
    <meta name="theme-color" content="#2fbdff" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS: als App vom Home-Bildschirm, Statusleiste über dem Spiel (Safe-Area wird beachtet) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Highs &amp; Lows" />
    <title>Highs &amp; Lows</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
